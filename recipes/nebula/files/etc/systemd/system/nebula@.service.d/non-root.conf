# Overrides to run nebula as a non-root user
# https://nebula.defined.net/docs/guides/running-nebula-as-non-root/

[Service]
User=nebula
Group=nebula
CapabilityBoundingSet=CAP_NET_ADMIN
AmbientCapabilities=CAP_NET_ADMIN
ExecStartPre=+/usr/bin/mkdir -p /run/nebula
ExecStartPre=+/usr/bin/chown nebula:nebula /run/nebula
